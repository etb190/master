<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>God Game</title>
<style>
  :root { box-sizing: border-box; color-scheme: dark; --bg: #01030a; --fg: #cfd8ee; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg); background: var(--bg); z-index: 5; transition: opacity .8s; letter-spacing: .08em; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--fg); opacity: .6; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">Creating a new world…</div>
<div id="hint">Drag to rotate · scroll or pinch to zoom</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const RADIUS = 5;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 3, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
renderer.outputEncoding = THREE.sRGBEncoding;

// --- Earth-like world, generated on the GPU (sharp at any zoom, nothing like our Earth) ---
const GLSL = `
precision highp float;
varying vec2 vUv;
uniform float mode; uniform float sea; uniform vec2 res;
const float PI = 3.14159265;
const vec3 SEED = vec3(3.7, 11.3, 5.1);
vec3 dirFromUv(vec2 uv){ float phi = uv.x * 2.0 * PI; float lat = (uv.y - 0.5) * PI; float cl = cos(lat); return vec3(-cos(phi) * cl, sin(lat), sin(phi) * cl); }
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float gnc(vec3 i, vec3 f){ return dot(hash33(i) * 2.0 - 1.0, f); }
float gn(vec3 p){
  vec3 i = floor(p), f = fract(p), u = f*f*f*(f*(f*6.0-15.0)+10.0);
  return mix(mix(mix(gnc(i,f), gnc(i+vec3(1,0,0),f-vec3(1,0,0)), u.x), mix(gnc(i+vec3(0,1,0),f-vec3(0,1,0)), gnc(i+vec3(1,1,0),f-vec3(1,1,0)), u.x), u.y),
             mix(mix(gnc(i+vec3(0,0,1),f-vec3(0,0,1)), gnc(i+vec3(1,0,1),f-vec3(1,0,1)), u.x), mix(gnc(i+vec3(0,1,1),f-vec3(0,1,1)), gnc(i+vec3(1,1,1),f-vec3(1,1,1)), u.x), u.y), u.z);
}
float fbm4(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * gn(p); p *= 2.03; a *= 0.5; } return s; }
float landH(vec3 p){
  vec3 q = p * 1.1 + SEED;
  q += 0.6 * vec3(gn(q*1.6), gn(q*1.6+vec3(5.2,1.3,8.1)), gn(q*1.6+vec3(2.9,7.7,3.3)));
  float s = 0.0, a = 0.5, f = 1.0;
  for (int i = 0; i < 10; i++) { s += a * gn(q * f); f *= 2.02; a *= 0.5; }
  return s;
}
float ridge(vec3 p){ float s = 0.0, a = 0.5, f = 1.0; for (int i = 0; i < 6; i++) { float r = max(1.0 - abs(gn(p*f)*1.6), 0.0); s += a*r*r; f *= 2.1; a *= 0.5; } return s; }
float elev(vec3 p, float h){
  float ls = h - sea; if (ls < 0.0) return 0.0;
  float inl = smoothstep(0.02, 0.22, ls);
  float mask = smoothstep(-0.1, 0.3, gn(p*1.3 + vec3(40.0)));
  return ls * 1.5 + max(ridge(p*2.6 + SEED) * mask * inl - 0.2, 0.0) * 1.3;
}
float sq(float x){ return x * x; }
vec3 C(float r, float g, float b){ return vec3(r, g, b) / 255.0; }
vec3 surface(vec3 p, float h){
  float ls = h - sea, ay = abs(p.y), latDeg = degrees(asin(clamp(ay, 0.0, 1.0)));
  float dN = gn(p*45.0)*0.5+0.5, dM = gn(p*9.0)*0.5+0.5;
  if (ls < 0.0) {
    float t = clamp(-ls / 0.3, 0.0, 1.0);
    vec3 c = t < 0.3 ? mix(C(46.0,140.0,170.0), C(14.0,70.0,128.0), t/0.3) : mix(C(14.0,70.0,128.0), C(5.0,24.0,66.0), (t-0.3)/0.7);
    c *= 0.96 + 0.08 * dN;
    return mix(c, C(226.0,237.0,247.0), smoothstep(0.86, 0.93, ay + (dM-0.5)*0.08));
  }
  float E = elev(p, h);
  float m = 0.5 + 1.3 * fbm4(p*1.7 + vec3(40.0));
  m += 0.18*exp(-sq((latDeg-3.0)/14.0)) - 0.3*exp(-sq((latDeg-26.0)/9.0)) + 0.08*smoothstep(40.0, 60.0, latDeg);
  m = clamp(m, 0.0, 1.0);
  float temp = 1.0 - pow(ay, 1.5)*1.15 - E*0.45 + (dM-0.5)*0.12;
  vec3 c;
  if (m < 0.3) c = mix(C(198.0,160.0,100.0), C(160.0,150.0,80.0), m/0.3*0.5);
  else if (m < 0.5) c = mix(C(160.0,150.0,80.0), C(92.0,130.0,62.0), (m-0.3)/0.2);
  else if (m < 0.7) c = mix(C(92.0,130.0,62.0), C(38.0,88.0,44.0), (m-0.5)/0.2);
  else c = mix(C(38.0,88.0,44.0), C(18.0,70.0,36.0), (m-0.7)/0.3);
  c = mix(c, C(48.0,80.0,58.0), (1.0 - smoothstep(0.28, 0.45, temp)) * (m > 0.35 ? 1.0 : 0.4));
  c = mix(c, C(130.0,130.0,110.0), 1.0 - smoothstep(0.18, 0.3, temp));
  c = mix(c, C(208.0,191.0,142.0), (1.0 - smoothstep(0.0, 0.012, ls)) * 0.95);
  c = mix(c, C(112.0,100.0,90.0), smoothstep(0.5, 0.75, E));
  c = mix(c, C(245.0,248.0,252.0), max(1.0 - smoothstep(0.06, 0.18, temp), smoothstep(0.85, 1.1, E)));
  return c * (0.86 + 0.28 * dN) * (0.92 + 0.16 * dM);
}
void main(){
  vec2 uv = vec2(vUv.x, clamp(vUv.y, 0.002, 0.998));
  vec3 p = dirFromUv(uv);
  if (mode < 0.5) { float h = landH(p); gl_FragColor = vec4(vec3(clamp((h + 0.8) / 1.6, 0.0, 1.0)), 1.0); return; }
  if (mode < 1.5) { gl_FragColor = vec4(surface(p, landH(p)), 1.0); return; }
  if (mode < 2.5) {
    vec2 d = 1.0 / res;
    vec3 pe = dirFromUv(uv + vec2(d.x, 0.0)), pw = dirFromUv(uv - vec2(d.x, 0.0));
    vec3 pn = dirFromUv(uv + vec2(0.0, d.y)), ps = dirFromUv(uv - vec2(0.0, d.y));
    float sx = (elev(pe, landH(pe)) - elev(pw, landH(pw))) / max(length(pe - pw) * 5.0, 1e-4);
    float sy = (elev(pn, landH(pn)) - elev(ps, landH(ps))) / max(length(pn - ps) * 5.0, 1e-4);
    vec3 n = normalize(vec3(-sx * 0.12, -sy * 0.12, 1.0));
    gl_FragColor = vec4(n * 0.5 + 0.5, 1.0); return;
  }
  if (mode < 3.5) {
    float h = landH(p), ice = smoothstep(0.86, 0.93, abs(p.y));
    float s = h < sea ? 1.0 - ice * 0.85 : 0.08;
    gl_FragColor = vec4(vec3(s), 1.0); return;
  }
  vec3 q = p * 2.2 + SEED * 2.0;
  q += 0.5 * vec3(gn(q), gn(q + 7.1), gn(q + 3.3));
  float c = 0.0, a = 0.5, f = 1.0;
  for (int i = 0; i < 6; i++) { c += a * gn(q * f); f *= 2.1; a *= 0.5; }
  c += 0.12 * cos(p.y * 9.0);
  gl_FragColor = vec4(1.0, 1.0, 1.0, smoothstep(0.02, 0.38, c) * 0.9);
}`;

const earthMat = new THREE.MeshPhongMaterial({ color: 0x0b2a55, specular: new THREE.Color(0x4a5566), shininess: 28 });
const earth = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 192, 192), earthMat);
scene.add(earth);
const cloudMat = new THREE.MeshLambertMaterial({ transparent: true, depthWrite: false, opacity: 0 });
const clouds = new THREE.Mesh(new THREE.SphereGeometry(RADIUS * 1.012, 128, 128), cloudMat);
scene.add(clouds);

function generateWorld(landFraction) {
  const passMat = new THREE.ShaderMaterial({
    uniforms: { mode: { value: 0 }, sea: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: GLSL, depthTest: false, depthWrite: false, blending: THREE.NoBlending
  });
  const qs = new THREE.Scene(), qc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  qs.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), passMat));
  const run = (mode, w, h, mips) => {
    const rt = new THREE.WebGLRenderTarget(w, h, { minFilter: mips ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: !!mips, depthBuffer: false });
    rt.texture.wrapS = THREE.RepeatWrapping; rt.texture.anisotropy = maxAniso;
    passMat.uniforms.mode.value = mode; passMat.uniforms.res.value.set(w, h);
    renderer.setRenderTarget(rt); renderer.render(qs, qc); renderer.setRenderTarget(null);
    return rt;
  };
  // 1) sample heights at low res to place sea level so that `landFraction` of the planet is land
  const SW = 512, SH = 256, buf = new Uint8Array(SW * SH * 4);
  const lo = run(0, SW, SH, false);
  renderer.readRenderTargetPixels(lo, 0, 0, SW, SH, buf);
  const hist = new Float64Array(256); let tot = 0;
  for (let j = 0; j < SH; j++) { const w = Math.cos((j + 0.5) / SH * Math.PI - Math.PI / 2) ; for (let i = 0; i < SW; i++) { hist[buf[(j * SW + i) * 4]] += Math.abs(w); tot += Math.abs(w); } }
  let acc = 0, bin = 0; for (; bin < 256; bin++) { acc += hist[bin]; if (acc >= tot * (1 - landFraction)) break; }
  passMat.uniforms.sea.value = (bin + 0.5) / 255 * 1.6 - 0.8;
  lo.dispose();
  // 2) render full-quality textures
  const big = renderer.capabilities.isWebGL2 && !matchMedia('(pointer: coarse)').matches && renderer.capabilities.maxTextureSize >= 8192;
  const W = big ? 6144 : 4096, H = W / 2;
  const col = run(1, W, H, true); col.texture.encoding = THREE.sRGBEncoding;
  const nrm = run(2, 4096, 2048, true);
  const spc = run(3, 2048, 1024, true);
  const cld = run(4, 2048, 1024, true);
  earthMat.color.set(0xffffff);
  earthMat.map = col.texture; earthMat.normalMap = nrm.texture; earthMat.specularMap = spc.texture;
  earthMat.needsUpdate = true;
  cloudMat.map = cld.texture; cloudMat.opacity = 1; cloudMat.needsUpdate = true;
}
setTimeout(() => {
  generateWorld(0.45);
  const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 900);
}, 60);

// atmosphere glow
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS * 1.07, 64, 64),
  new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: 'varying vec3 n; void main(){ n = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 n; void main(){ float i = pow(0.64 - dot(n, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.25,0.55,1.0,1.0) * i; }'
  })
));

scene.add(new THREE.AmbientLight(0x9fb0d0, 0.5));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.35);
sun.position.set(20, 8, 15);
scene.add(sun);

// --- Stars: varied size/colour, twinkling, plus a Milky Way band and nebula haze ---
function rand(a, b) { return a + Math.random() * (b - a); }
const N = 7000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N);
const tilt = new THREE.Euler(0.9, 0.4, 0.3);
const palette = [[0.62, 0.72, 1], [0.8, 0.86, 1], [1, 1, 1], [1, 0.93, 0.78], [1, 0.78, 0.58], [1, 0.62, 0.5]];
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
for (let i = 0; i < N; i++) {
  const band = i > N * 0.4; // 60% of stars cluster in the galactic band
  let v;
  if (band) {
    v = new THREE.Vector3(Math.cos(rand(0, 6.2832)), gauss() * 0.22, Math.sin(rand(0, 6.2832)));
    const a = rand(0, 6.2832); v.set(Math.cos(a), gauss() * 0.2, Math.sin(a)).applyEuler(tilt);
  } else {
    v = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1));
    if (v.length() > 1) { i--; continue; }
  }
  v.normalize().multiplyScalar(900);
  pos.set([v.x, v.y, v.z], i * 3);
  const c = palette[Math.floor(Math.random() * palette.length)], br = rand(0.5, 1);
  col.set([c[0] * br, c[1] * br, c[2] * br], i * 3);
  size[i] = Math.random() < 0.03 ? rand(3.5, 5.5) : rand(0.8, 2.4);
  phase[i] = rand(0, 6.28);
}
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
sg.setAttribute('size', new THREE.BufferAttribute(size, 1));
sg.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, pr: { value: renderer.getPixelRatio() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: 'attribute float size; attribute float phase; attribute vec3 color; uniform float time; uniform float pr; varying vec3 c; varying float t; void main(){ c = color; t = 0.75 + 0.25 * sin(time * 1.5 + phase * 3.0); gl_PointSize = size * pr * (0.9 + 0.2 * t); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 c; varying float t; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard; float a = pow(1.0 - d * 2.0, 1.6) * t; gl_FragColor = vec4(c * 1.3, a); }'
});
const stars = new THREE.Points(sg, starMat);
scene.add(stars);

// nebula haze sprites
function glow(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, `rgba(${r},${g},${b},0.5)`); gr.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const hazes = [[90, 70, 200], [40, 110, 200], [190, 70, 140], [60, 150, 180]];
const nebula = new THREE.Group();
for (let i = 0; i < 26; i++) {
  const h = hazes[i % hazes.length], a = rand(0, 6.2832);
  const p = new THREE.Vector3(Math.cos(a), gauss() * 0.3, Math.sin(a)).applyEuler(tilt).multiplyScalar(850);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow(...h), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: rand(0.25, 0.55) }));
  s.position.copy(p); s.scale.setScalar(rand(300, 650));
  nebula.add(s);
}
scene.add(nebula);

// --- controls ---
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = RADIUS + 1.0;
controls.maxDistance = 40;
controls.rotateSpeed = 0.6;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop(t) {
  requestAnimationFrame(loop);
  starMat.uniforms.time.value = (t || 0) / 1000;
  clouds.rotation.y += 0.00006; stars.rotation.y += 0.00003; nebula.rotation.y += 0.00003;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
